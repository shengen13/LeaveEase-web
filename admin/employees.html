<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Admin Dashboard</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.13.1/font/bootstrap-icons.min.css"
    />

    <link rel="stylesheet" href="../css/employe_edit.css" />
  </head>

  <body>
    <div class="wrapper">
<aside class="sidebar">
        <div>
          <div class="logo">
            <img src="../assets/images/logo.png" alt="Logo" />

            <h3>LeaveEase</h3>
          </div>

          <nav>
            <a href="admin_dashboard.html" class="menu-item active"> Dashboard </a>

            <a href="#" class="menu-item">Settings </a>
         </nav>
        </div>
      </aside>

      <main class="main-content">
        <header class="topbar">
          <div class="profile">
            <span class="admin-name" id="adminName">Loading...</span>

            <img src="https://i.pravatar.cc/40?img=12" alt="Admin" />
          </div>
        </header>

        <div class="dashboard-content">
          <section class="employee-table">
            <div class="table-header">
              <a href="admin_dashboard.html" class="back-btn">
                <i class="bi bi-arrow-left"></i>
                Back to Dashboard
              </a>
              <h2>Employee Management</h2>

              <div class="table-tools">
                <div class="search-box">
                  <i class="bi bi-search"></i>

                  <input
                    type="text"
                    id="searchEmployee"
                    placeholder="Search employee..."
                  />
                </div>
              </div>
            </div>

            <table class="leave-table">
              <thead>
                <tr>
                  <th>NAME</th>
                  <th>EMAIL</th>
                  <th>DEPARTMENT</th>
                  <th>DESIGNATION</th>
                  <th>ROLE</th>
                  <th>ACTIONS</th>
                </tr>
              </thead>

              <tbody id="employeeTable"></tbody>
            </table>
          </section>
        </div>
      </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="../js/employees.js"></script>
  </body>
</html>
