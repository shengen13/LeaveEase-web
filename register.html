<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register | LeaveEase</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />

    <!-- Google Font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/choices.js/public/assets/styles/choices.min.css"
    />

    <!-- CSS -->
    <link rel="stylesheet" href="css/register.css" />
  </head>

  <body>
    <div class="register-page">
      <!-- LEFT SIDE -->
      <div class="left-section">
        <img
          src="assets/images/login-illustration.png"
          class="bg-image"
          alt="Illustration"
        />
      </div>

      <!-- RIGHT SIDE -->
      <div class="right-section">
        <div class="register-card">
          <div class="logo-box">
            <img src="assets/images/logo.png" class="logo" alt="Logo" />

            <h1>LeaveEase</h1>

            <p>Create Employee Account</p>
          </div>

          <form id="registerForm" onsubmit="return false;">
            <!-- Row 1 -->
            <div class="form-row">
              <div class="input-box">
                <i class="bi bi-person-fill"></i>

                <input type="text" id="fullName" placeholder="Full Name" />
              </div>

              <div class="input-box">
                <i class="bi bi-envelope-fill"></i>

                <input type="email" id="email" placeholder="Email Address" />
              </div>
            </div>

            <!-- Row 2 -->
            <div class="form-row">
              <div class="input-box">
                <i class="bi bi-building"></i>

                <select id="department">
                  <option selected disabled>Department</option>

                  <option>Information Technology</option>

                  <option>Human Resources</option>

                  <option>Finance</option>

                  <option>Marketing</option>

                  <option>Sales</option>

                  <option>Operations</option>
                </select>
              </div>

              <div class="input-box">
                <i class="bi bi-briefcase-fill"></i>

                <select id="designation">
                  <option selected disabled>Designation</option>

                  <option>Software Developer</option>

                  <option>Team Lead</option>

                  <option>HR Executive</option>

                  <option>Accountant</option>

                  <option>Manager</option>
                </select>
              </div>
            </div>

            <!-- Row 3 -->
            <div class="form-row">
              <div class="input-box">
                <i class="bi bi-lock-fill"></i>

                <input type="password" id="password" placeholder="Password" />
              </div>

              <div class="input-box">
                <i class="bi bi-shield-lock-fill"></i>

                <input
                  type="password"
                  id="confirmPassword"
                  placeholder="Confirm Password"
                />
              </div>
            </div>

            <!-- Terms -->

            <div class="terms">
              <input type="checkbox" id="termsAndConditions" />

              <label for="termsAndConditions">
                I agree to the Terms & Conditions
              </label>
            </div>

            <!-- Button -->

            <button type="submit" id="registerBtn" class="register-btn">
              Create Account
            </button>

            <p class="login-text">
              Already have an account?

              <a href="login.html"> Login </a>
            </p>
          </form>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="js/auth.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/choices.js/public/assets/scripts/choices.min.js"></script>
  </body>
</html>
